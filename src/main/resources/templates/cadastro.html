<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeca('Criar conta')}"></head>
<body>
<nav th:replace="~{fragmentos :: topo}"></nav>
<main class="auth">
  <div class="lado">
    <div class="cor2"><svg th:replace="~{fragmentos :: cupcake}"></svg></div>
    <h1>Crie sua conta e escolha seus sabores.</h1>
  </div>
  <div class="form">
    <h2>Criar conta</h2>
    <div class="aviso erro" th:if="${erro}" th:text="${erro}">Erro</div>
    <form th:action="@{/cadastro}" method="post">
      <label for="nome">Nome</label>
      <input id="nome" name="nome" autocomplete="name" required>
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="telefone">Telefone</label>
      <input id="telefone" name="telefone" type="tel" autocomplete="tel">
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" minlength="6" autocomplete="new-password" required>
      <p class="dica">Use pelo menos 6 caracteres.</p>
      <button class="btn" type="submit">Criar conta</button>
    </form>
    <p class="suave">Já tem conta? <a class="link" th:href="@{/login}">Entrar</a></p>
  </div>
</main>
<footer th:replace="~{fragmentos :: rodape}"></footer>
</body>
</html>
